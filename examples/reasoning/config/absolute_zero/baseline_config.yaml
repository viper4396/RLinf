# Phase 0 frozen expansion of AZR's paper-version coder3b.sh.
#
# This file is a reproduction contract, not an executable RLinf config yet.
# Values are explicit so later migration code cannot silently inherit the
# current AZR master defaults or the current RLinf reasoning defaults.

schema_version: 1
source:
  repository: LeapLabTHU/Absolute-Zero-Reasoner
  revision: 41ed983cdf541cfcd2f963f33c055d50074f3c90
  script: scripts/selfplay/coder3b.sh
  base_config: absolute_zero_reasoner/configs/azr_ppo_trainer.yaml

data:
  shuffle: true
  train_files: data/code_reason/test_answer.parquet
  val_files: data/code_reason/test_answer.parquet
  prompt_key: prompt
  train_batch_size: 64
  val_batch_size: 1312
  max_prompt_length: 6144
  max_validation_prompt_length: 6144
  max_response_length: 8096
  return_raw_input_ids: false
  return_raw_chat: false

model:
  path: Qwen/Qwen2.5-Coder-3B
  pretrained_tokenizer: true
  use_remove_padding: true
  enable_gradient_checkpointing: true

actor:
  strategy: fsdp
  learning_rate: 1.0e-6
  ppo_mini_batch_size: 128
  ppo_micro_batch_size_per_gpu: 16
  ppo_max_token_len_per_gpu: 16384
  use_dynamic_bsz: false
  grad_clip: 1.0
  clip_ratio: 0.2
  entropy_coeff: 0.001
  use_kl_loss: false
  kl_loss_coef: 0.0
  kl_loss_type: low_var_kl
  ppo_epochs: 1
  shuffle: false
  ulysses_sequence_parallel_size: 2
  param_offload: false
  grad_offload: false
  optimizer_offload: false

reference:
  include_ref: false
  param_offload: true
  log_prob_micro_batch_size_per_gpu: 64

rollout:
  backend: vllm
  dtype: bfloat16
  top_k: -1
  top_p: 1.0
  tensor_parallel_size: 2
  log_prob_micro_batch_size_per_gpu: 64
  max_num_batched_tokens: 16384
  max_num_seqs: 1024
  gpu_memory_utilization: 0.4
  enforce_eager: false
  free_cache_engine: false
  load_format: dummy_dtensor
  enable_chunked_prefill: true
  disable_log_stats: true
  n: 1
  temperature: 1.0

algorithm:
  advantage: reinforce_plus_plus
  gamma: 1.0
  lam: 1.0
  kl_penalty: kl
  kl_controller: fixed
  kl_coefficient: 0.0
  critic: false

reward:
  extraction_type: answer_conditional
  math_metric: math_verify
  difficulty_samples: 8
  code_f_reward_type: binary
  generation_accuracy_conversion: one_minus
  intrinsic_combine_method: sum
  format_reward: true
  reject_multiple_functions: true
  reject_test_input_in_code: false
  f_replace_location: not_first
  remove_input_from_snippet: false
  include_references: true
  use_original_code_as_ref: true
  remove_comments: false
  remove_after_return: false
  remove_print: false
  complexity_reward:
    enabled: false
    coefficient: 0.0
    maximum: 0.0
  mean_edit_distance_reward:
    enabled: false
    coefficient: 0.0
    maximum: 0.0
  halstead_reward:
    enabled: false
    coefficient: 0.0
    maximum: 0.0
  answer_diversity_reward:
    enabled: false
    coefficient: 0.0
    maximum: 0.0
    hierarchical: false

program_pool:
  problem_types:
    - code_i
    - code_o
    - code_f
  prediction_mix_strategy: max_new
  generation_probability_strategy: uniform
  update_iteration: 1
  past_epoch_window: 1
  seed_batch_factor: 4
  pretrain_pred_steps: -1
  valid_program_filter: all
  max_programs: 16384
  batched_estimate: false
  content_max_length: 8096
  composite_start_step: -1
  composite_chance: 0.0
  composite_function_n_min: 0
  composite_function_n_max: 0
  num_inputs_for_code_f: 10
  executor: qwq
  executor_max_workers: 1
  executor_cleanup_frequency: 1
  ast_check: true
  execute_max_timeout_seconds: 10
  random_print_max_programs: 3
  banned_keywords_for_errors_and_exceptions:
    - raise
  train_propose: true

seed_data:
  io: data/3b_coder_seed_io.jsonl
  error: data/3b_coder_error_seed_io.jsonl
  error_required_for_paper_problem_types: false
  code_f: data/3b_coder_code_f_seed_io.jsonl
  output_io: data/3b_coder_seed_io.jsonl
  output_error: data/3b_coder_error_seed_io.jsonl
  output_code_f: data/3b_coder_code_f_seed_io.jsonl

trainer:
  project_name: azr
  experiment_name: azr_coder3b
  nnodes: 1
  gpus_per_node: 2
  save_frequency: 10
  test_frequency: 10
  critic_warmup: 0
  total_epochs: 30
  resume_mode: auto
  debug: false
  val_generations_to_log_to_wandb: 0
  wandb_run_id: null
  logger:
    - console
    - wandb
  val_before_train: false
  remove_previous_checkpoint: true
  delete_local_checkpoint_after_load: true

environment:
  VLLM_ATTENTION_BACKEND: FLASH_ATTN
  RAY_memory_monitor_refresh_ms: "0"
  RAY_LOGGING_LEVEL: DEBUG
  HYDRA_FULL_ERROR: "1"

short_baseline:
  minimum_steps: 20
  maximum_steps: 100
  expected_trace_fields:
    - global_step
    - proposal_responses
    - difficulty_solve_responses
    - formal_solve_responses
    - proposal_rewards
    - solve_rewards
    - valid_programs
    - program_pool_size
