defaults:
  - base_eval
  - _self_

runner:
  experiment_name: graph_item
  output_dir: ./logs/eval

agentloop:
  workflow: mas_graph
  toolcall_parser: wideseek_r2-graph-qwen
  graph_memory:
    enabled: true
    # Phase 2 retrieval, Phase 4 Audit/Render, and the Phase 5 item contract
    # run in the existing mas_graph workflow and parser.
    eval_allow_direct_answer_fallback: false
    item_require_terminal_fact: true
    item_terminal_tag: terminal

data:
  type: wideseek_r2
  answer_type: item
  is_gisa: true
