defaults:
  - base_train

cluster:
  num_nodes: 1
  component_placement:
    actor,reward: all
    rollout: all

runner:
  experiment_name: test_minibatch_2
  output_dir: ../logs/train
  seq_length: 32768
  max_tokens_per_mbs: 32768

  max_epochs: 1
  max_steps: -1  

  val_check_interval: 30
  save_interval: 30

algorithm:
  training_batch_size_per_gpu: 1
  group_size: 8
  n_minibatches: 2

  clip_ratio_low: 0.2
  clip_ratio_high: 0.28
  clip_ratio_c: 10

  loss_scales: ["group_level", "agent_level", "turn_level"] # used for implementing our GRPO alg. Details in `rlinf/algorithms/loss_scales.py`
  advantage_mode: trajectory

agentloop:
  workflow: mas # or sa, mas refers to multi-agent, sa refers to single-agent
  llm_ip: 172.27.214.151 # TODO:(USER) Replace with the actual IP address of the LLM judge server
  llm_port: 30000 # TODO:(USER) Replace with the actual port of the LLM judge server
  use_local_judge: False # Whether to use the RLinf internal judge llm. If set to true, the judge llm will be run within RLinf framwork. Otherwise, the judge llm will be run on the external server.
  format_reward: 0.05
  max_workers_per_planner: -1

rollout:
  gpu_memory_utilization: 0.7
  model:
    model_path: /mnt/project_rlinf/xzxuan/model/Qwen3-4B # TODO:(USER) Replace with the actual path to the model checkpoint

tools:
  online: False

data:
  type: wideseek_r2
  rollout_batch_size: 128
  prompt_key: question
  answer_key: answer
  answer_mode: markdown
  unique_columns: unique_columns 
  train_data_paths: /mnt/project_rlinf/xzxuan/wideseek-train_data/hybrid_20k.jsonl # TODO:(USER) Replace with the actual path to the training dataset
  shuffle: False
  is_hybrid: True
  data_size: -1

actor:
  model:
    megatron_checkpoint: '/mnt/project_rlinf/xzxuan/WideSeek-R2/xzxuan/converted_ckpts/qwen3_4b_tp2'
    recompute_num_layers: 36

    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    sequence_parallel: True

  megatron:
    use_hf_ckpt: False
    ckpt_convertor:
      model: Qwen3-4B

